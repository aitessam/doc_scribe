[project]
name = "docscribe"
version = "1.0.0"
description = "Real-time Urdu + English medical transcription and structured clinical note generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Aitessam" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP038"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]
