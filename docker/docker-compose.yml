services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python server.py
    env_file:
      - ../.env
    environment:
      API_HOST: 0.0.0.0
      LLM_ENDPOINT: http://ollama:11434/api/chat
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - ../.env
    environment:
      API_HOST: backend
    ports:
      - "8501:8501"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
